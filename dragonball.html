<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>FINAL HD</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;display:flex;flex-direction:column;align-items:center}
#game{width:900px;max-width:95vw;height:480px;background:linear-gradient(#ffcc00,#ff5500);border:4px solid #fff;position:relative;overflow:hidden}
.fighter{position:absolute;bottom:10px;width:240px;height:340px;background-size:contain;background-repeat:no-repeat;background-position:bottom;transition:.15s}
#goku{left:60px;background-image:url('goku.png')}
#piccolo{right:60px;background-image:url('piccolo.png');transform:scaleX(-1)}
.bar{position:absolute;top:10px;width:40%;height:28px;background:#000;border:3px solid #fff}
#bar-goku{left:10px} #bar-piccolo{right:10px} .fill{height:100%;width:100%;transition:.3s}
#fill-goku{background:lime} #fill-piccolo{background:magenta}
button{padding:12px 18px;margin:8px;font-weight:bold;border:3px solid #000;box-shadow:4px 4px 0 #000;cursor:pointer}
#log{width:900px;max-width:95vw;height:130px;background:#111;border:3px solid #fff;padding:10px;font-size:11px;overflow-y:auto;margin-top:10px}
.hit{filter:brightness(2.5)} .kame{position:absolute;top:50%;width:60px;height:30px;background:radial-gradient(#fff,#0af,#00f);border-radius:50%;animation:fly .6s linear}
@keyframes fly{from{left:250px} to{left:750px}}
</style></head>
<body>
<h1>🐉 GOKU VS PICCOLO - FINAL HD 🐉</h1>
<div id="game">
<div class="bar" id="bar-goku"><div class="fill" id="fill-goku"></div></div>
<div class="bar" id="bar-piccolo"><div class="fill" id="fill-piccolo"></div></div>
<div class="fighter" id="goku"></div><div class="fighter" id="piccolo"></div>
</div>
<div><button style="background:#ffcc00" onclick="attack('golpe')">GOLPE</button><button style="background:#0af;color:#fff" onclick="attack('kame')">KAMEHAMEHA</button><button onclick="resetGame()">RESET</button></div>
<div id="log"></div>
<script>
let goku={vida:100,max:100,el:goku,atacar(e,t){let d=t==='kame'?40:18;if(t==='kame')d+=Math.floor(Math.random()*10);e.vida=Math.max(0,e.vida-d);return d;}};
let piccolo={vida:130,max:130,el:piccolo,atacar(e){let d=15+Math.floor(Math.random()*18);e.vida=Math.max(0,e.vida-d);return d;}};
goku.el=document.getElementById('goku');piccolo.el=document.getElementById('piccolo');
let log=document.getElementById('log');
function l(t){log.innerHTML+=t+"<br>";log.scrollTop=9999}
function upd(){document.getElementById('fill-goku').style.width=goku.vida+"%";document.getElementById('fill-piccolo').style.width=piccolo.vida/piccolo.max*100+"%";}
function attack(t){
 goku.el.style.transform="translateX(50px)";setTimeout(()=>goku.el.style.transform="",200);
 if(t==='kame'){let b=document.createElement('div');b.className='kame';document.getElementById('game').appendChild(b);setTimeout(()=>b.remove(),600);}
 let d=goku.atacar(piccolo,t);l(`GOKU ${t.toUpperCase()} -${d} | Piccolo ${piccolo.vida}`);upd();
 if(piccolo.vida<=0){l("🏆 GANA GOKU!");return}
 setTimeout(()=>{piccolo.el.style.transform="scaleX(-1) translateX(50px)";setTimeout(()=>piccolo.el.style.transform="scaleX(-1)",200);
 let d2=piccolo.atacar(goku);l(`PICCOLO MAKOSEN -${d2} | Goku ${goku.vida}`);upd();},600);
}
function resetGame(){goku.vida=100;piccolo.vida=130;upd();log.innerHTML="OBJETOS: goku {vida:100, poder:95} | piccolo {vida:130, poder:98}<br><br>";}
resetGame();
</script></body></html>
